name: Validate skill package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s skills/customer-development/scripts -p 'test_*.py' -v
      - run: python install.py --verify-only
